<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Aplikasi & Repositori</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .profile-img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      margin-bottom: 16px;
      border: 2px solid #30363d;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #f0f6fc;
      margin-bottom: 8px;
    }

    p.bio {
      font-size: 0.9rem;
      color: #8b949e;
      margin-bottom: 24px;
    }

    .links-wrapper {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-card {
      display: block;
      padding: 14px 20px;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #f0f6fc;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .link-card:hover {
      background-color: #21262d;
      border-color: #8b949e;
      transform: translateY(-2px);
    }

    footer {
      margin-top: 32px;
      font-size: 0.8rem;
      color: #484f58;
    }
  </style>
</head>
<body>

  <div class="container">

    <h1>subkhanfebrianto72-maker</h1>
    <p class="bio">Daftar Aplikasi & Web Project</p>

    <div class="links-wrapper">

      <a href="https://subkhanfebrianto72-maker.github.io/linkku/MTS/kuis_fikih_kelas_ix_hots.html" class="link-card" target="_blank">Quiz Fikih Kelas IX Bab 1 (HOTS)</a>
      <a href="https://subkhanfebrianto72-maker.github.io/linkku/MTS/kuis_fikih_kelas_ix_reguler.html" class="link-card" target="_blank">Quiz Fikih Kelas IX Bab 1 (REGULER)</a>
